# Gemini Decision 1

Gemini Decision 1 is a specialized multimodal model built for the
[Decisions API](/docs/decisions-api). It evaluates typed questions over text,
images, video, audio, and PDFs in a single prefill pass and returns calibrated
outcome probabilities with zero output tokens.

Use Gemini Decision 1 for request routing, policy checks across many rules at
once, candidate scoring against a rubric, tool selection, and low-latency
classification over live media streams. A single request can evaluate up to
1,000 independent questions over shared input up to 262,144 tokens:

*   **Yes/no:** Returns a calibrated probability from 0.01 to 0.99 and a
  confidence score.
*   **Single-select:** Evaluates 2 to 255 options and returns the top option,
  per-option probabilities, and confidence.
*   **Rubric rating:** Evaluates 2 to 255 ordered rubric levels and returns the
  probability-weighted expected score, per-level probabilities, and
  confidence.

## Quickstart  {% id=&quot;quickstart&quot; %}

Evaluate a yes/no question and a routing choice over the same customer message
in one call:

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=&quot;The blue mug I ordered on Monday arrived cracked on Wednesday.&quot;,
      questions={
          &quot;is_damaged&quot;: {
              &quot;type&quot;: &quot;noul&quot;,
              &quot;instructions&quot;: &quot;Did the item arrive damaged?&quot;,
          },
          &quot;queue&quot;: {
              &quot;type&quot;: &quot;choice&quot;,
              &quot;instructions&quot;: &quot;Which support queue should handle this message?&quot;,
              &quot;criteria&quot;: {
                  &quot;billing&quot;: &quot;Payment, invoice, or refund questions.&quot;,
                  &quot;replacements&quot;: &quot;Damaged, missing, or wrong items.&quot;,
                  &quot;general&quot;: &quot;Product questions and account updates.&quot;,
              },
          },
      },
  )
  
  damaged = result.answers[&quot;is_damaged&quot;]
  queue = result.answers[&quot;queue&quot;]
  print(f&quot;P(damaged)={damaged.noul:.2f} queue={queue.choice}&quot;)
  ```

# Decisions API

Generative models produce text for people to read. When your code needs a
judgment to branch on, generating and parsing text adds latency and brittle
parsing logic.

The Decisions API evaluates typed questions over text, PDFs, audio, images, and
video. It uses [Gemini Decision 1](/docs/models/gemini-decision-1) and returns
calibrated probabilities. It generates zero text tokens, so output token usage
is always 0. Your code can branch, sort, and route on the response directly.

## How it works  {% id=&quot;how-it-works&quot; %}

Each call sends [shared input](/docs/decisions-api#input) and a map of
questions, and returns one typed answer per question. Shared input can combine
text, JSON, [PDF documents](/docs/decisions-api#documents),
[audio](/docs/decisions-api#audio), [images](/docs/decisions-api#media), and
[video](/docs/decisions-api#video):

![](https://www.gstatic.com/cloud-cms/55bb56725305bef6dd99ace3e16515c1.png)

Every question uses one of three [question types](/docs/decisions-api#question-types):

| Question type | Goal | Returns |
| :--- | :--- | :--- |
| [Yes/no (`noul`)](/docs/decisions-api#noul) | Check whether a statement holds | `noul` (0.01 to 0.99), `confidence` |
| [Choice (`choice`)](/docs/decisions-api#choice) | Pick one option from a fixed list | `choice`, `probabilities`, `confidence` |
| [Score (`score`)](/docs/decisions-api#score) | Rate input against ordered rubric levels | `score`, `probabilities`, `legend`, `confidence` |

Keep three ideas in mind when building with Gemini Decision 1:

*   **Parallel, isolated scoring:** Every question runs against the shared input
  in one forward pass. Questions can&#39;t see each other, and latency stays
  nearly flat when you
  [ask multiple questions](/docs/decisions-api#multiple-questions).
*   **Value plus confidence:** The answer tells your code what action fits.
  [Confidence](/docs/decisions-api#confidence) tells your code whether to run
  it automatically or escalate.
*   **Atomic checks, composed in code:** Ask narrow, single-purpose questions.
  Combine the answers with ordinary `if` statements and weights in code (see
  [Best practices](/docs/decisions-api#best-practices)).

## Quickstart  {% id=&quot;quickstart&quot; %}

Requires SDK 3.2 or later (`pip install -U google-genai` or
`npm install @google/genai@latest`). Pass a model, shared input, and a map of
questions. Each question requires a type ([`noul`](/docs/decisions-api#noul) for
yes/no) and instructions:

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=&quot;The blue mug I ordered on Monday arrived cracked on Wednesday.&quot;,
      questions={
          &quot;is_damaged&quot;: {
              &quot;type&quot;: &quot;noul&quot;,
              &quot;instructions&quot;: &quot;Did the item arrive damaged?&quot;,
          },
      },
  )
  
  answer = result.answers[&quot;is_damaged&quot;]
  print(f&quot;P(yes)={answer.noul:.2f} confidence={answer.confidence:.2f}&quot;)
  ```

  {% /tab %}

  {% tab filename=&quot;decisions.mjs&quot; label=&quot;JavaScript&quot; %}
  ```javascript
  import { GoogleGenAI } from &quot;@google/genai&quot;;
  
  const ai = new GoogleGenAI({ apiVersion: &quot;v1beta&quot; });
  
  const result = await ai.decisions.create({
    model: &quot;gemini-decision-1&quot;,

    questions: {
      is_damaged: {
        type: &quot;noul&quot;,
        instructions: &quot;Did the item arrive damaged?&quot;,
      },
    },
  });

    -d &#39;{
      &quot;model&quot;: &quot;gemini-decision-1&quot;,
      &quot;input&quot;: &quot;The blue mug I ordered on Monday arrived cracked on Wednesday.&quot;,
      &quot;questions&quot;: {
        &quot;is_damaged&quot;: {

## Question types  {% id=&quot;question-types&quot; %}

### Yes or no (noul)  {% id=&quot;noul&quot; %}

A yes/no question returns the calibrated probability that the answer is yes. Add
criteria to define what yes and no mean when the question alone is ambiguous.

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=&quot;Customer returned the sweater because they preferred green over blue.&quot;,
      questions={
          &quot;is_defect&quot;: {
              &quot;type&quot;: &quot;noul&quot;,
              &quot;instructions&quot;: &quot;Is the customer reporting a product defect?&quot;,
              &quot;criteria&quot;: {
                  &quot;true_description&quot;: &quot;The product itself is broken or faulty.&quot;,
                  &quot;false_description&quot;: &quot;Preference, sizing, shipping, or pricing complaint.&quot;,
              },
          },
      },
  )
  
  print(result.answers[&quot;is_defect&quot;].noul)
  ```

  {% /tab %}

  {% tab filename=&quot;decisions.mjs&quot; label=&quot;JavaScript&quot; %}

  const answer = result.answers?.is_defect;
  if (answer?.type === &quot;noul&quot;) console.log(answer.noul);

```json

```

{% callout type=&quot;note&quot; %}
  Yes/no probabilities always fall between 0.01 and 0.99. Set thresholds inside
  that range, since a check above 0.99 never matches.

{% /callout %}

### Pick one option (choice)  {% id=&quot;choice&quot; %}

A choice question scores a fixed set of options and returns both the top option
and the calibrated probability of every option (summing to 1). Criteria maps
each option ID to a description of when it applies. Use an empty string (`&quot;&quot;`)
when the option ID is self-explanatory.

Before evaluation, the API sorts option keys alphabetically in UTF-8 byte
order. Changing key order in your JSON request doesn&#39;t change option positions,
and exact probability ties break to the alphabetically first key.

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=&quot;I was charged twice for my order.&quot;,
      questions={
          &quot;department&quot;: {
              &quot;type&quot;: &quot;choice&quot;,
              &quot;instructions&quot;: &quot;Which department should handle this request?&quot;,
              &quot;criteria&quot;: {
                  &quot;billing&quot;: &quot;Payments, invoices, and refunds.&quot;,
                  &quot;technical&quot;: &quot;Problems using the product.&quot;,
                  &quot;shipping&quot;: &quot;Delivery and tracking.&quot;,
                  &quot;other&quot;: &quot;Anything outside these categories.&quot;,
              },
          },
      },
  )
  
  answer = result.answers[&quot;department&quot;]
  print(answer.choice, answer.confidence, answer.probabilities)
  ```

  {% /tab %}

{% callout type=&quot;note&quot; %}

  none fits. Threshold confidence to catch low-certainty inputs, pair the

  &quot;other&quot; with an explicit description. Avoid positional keys like
  &quot;none_of_the_above&quot;: alphabetical sorting places it ahead of keys like
  &quot;shipping&quot; and &quot;technical&quot; instead of last.

{% /callout %}

### Rate on a scale (score)  {% id=&quot;score&quot; %}

A score question rates the input across ordered levels. Criteria is an array of
non-empty level descriptions ordered from lowest to highest (2 to 255 levels,
with 2 to 10 recommended for most rubrics), indexed starting at 0.

The returned score is the probability-weighted average of the level indices, so
it can fall between levels, and legend maps each index back to its description.

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=&quot;Export fails in Safari but works in Chrome.&quot;,
      questions={
          &quot;severity&quot;: {
              &quot;type&quot;: &quot;score&quot;,
              &quot;instructions&quot;: &quot;How severe is this issue for the user?&quot;,
              &quot;criteria&quot;: [
                  &quot;Cosmetic: appearance only, no lost functionality.&quot;,
                  &quot;Workaround available: a task fails, but another way works.&quot;,
                  &quot;Fully blocked: a task fails with no workaround.&quot;,
              ],
          },
      },
  )
  
  answer = result.answers[&quot;severity&quot;]
  print(answer.score, answer.confidence, answer.probabilities)
  ```

  {% /tab %}

Because different probability distributions can produce the same expected
value (here 1.12, sitting just above level 1), check the per-level
probabilities and confidence alongside the score when inputs can split across
levels.

Use the score to rank inputs or filter candidate results against a rubric
threshold. When your code needs a discrete level, pick the entry with the
highest probability:

```python
level = max(answer.probabilities, key=answer.probabilities.get)  # &quot;1&quot;
print(answer.legend[level])  # &quot;Workaround available: ...&quot;
```

To compare scales with different numbers of levels, divide the score by the
highest level index to normalize it between 0 and 1.

## Ask multiple questions  {% id=&quot;multiple-questions&quot; %}

Put independent questions about the same input in one request. Shared input
counts once per request regardless of how many questions you ask (each question
adds only its own instructions and criteria), and question types can be mixed.
This example routes a support ticket using order data and the customer message.

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  import json
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})
  
  order = {&quot;order&quot;: {&quot;id&quot;: &quot;8821&quot;, &quot;item&quot;: &quot;headphones&quot;, &quot;price_usd&quot;: 240}, &quot;tier&quot;: &quot;Gold&quot;}
  message = {&quot;message&quot;: &quot;Audio cuts out on the left earcup. Fix it today or I cancel my membership.&quot;}
  
  result = client.decisions.create(
      model=&quot;gemini-decision-1&quot;,
      input=[
          {&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: json.dumps(order) + &quot;\n&quot;},
          {&quot;type&quot;: &quot;text&quot;, &quot;text&quot;: json.dumps(message)},
      ],
      questions={
          &quot;is_defect&quot;: {
              &quot;type&quot;: &quot;noul&quot;,
              &quot;instructions&quot;: &quot;Does `message` describe a hardware defect?&quot;,
          },
          &quot;next_action&quot;: {
              &quot;type&quot;: &quot;choice&quot;,
              &quot;instructions&quot;: &quot;What is the right resolution given `tier` and `order`?&quot;,
              &quot;criteria&quot;: {
                  &quot;instant_refund&quot;: &quot;Refund without return. Low value or clear fault.&quot;,
                  &quot;replacement_shipment&quot;: &quot;Ship a replacement. Customer returns the original.&quot;,
                  &quot;troubleshooting_flow&quot;: &quot;The issue may be fixable by the customer.&quot;,
                  &quot;human_escalation&quot;: &quot;&quot;,
              },
          },
          &quot;churn_risk&quot;: {
              &quot;type&quot;: &quot;score&quot;,
              &quot;instructions&quot;: &quot;How likely is the customer to churn if the issue is not resolved now?&quot;,
              &quot;criteria&quot;: [
                  &quot;No churn signal&quot;,
                  &quot;Mild frustration&quot;,
                  &quot;Mentions alternatives&quot;,
                  &quot;Threatens to cancel&quot;,
              ],
          },
      },
  )
  
  a = result.answers
  if a[&quot;is_defect&quot;].noul &gt; 0.9 and a[&quot;next_action&quot;].confidence &gt; 0.6:
      action = a[&quot;next_action&quot;].choice
  else:
      action = &quot;human_escalation&quot;
  
  print(action, a[&quot;churn_risk&quot;].score)
  ```

  {% /tab %}

  {% tab filename=&quot;decisions.mjs&quot; label=&quot;JavaScript&quot; %}
  ```javascript
  import { GoogleGenAI } from &quot;@google/genai&quot;;
  
  const ai = new GoogleGenAI({ apiVersion: &quot;v1beta&quot; });
  
  const order = { order: { id: &quot;8821&quot;, item: &quot;headphones&quot;, price_usd: 240 }, tier: &quot;Gold&quot; };
  const message = { message: &quot;Audio cuts out on the left earcup. Fix it today or I cancel my membership.&quot; };
  
  const result = await ai.decisions.create({
    model: &quot;gemini-decision-1&quot;,
    input: [
      { type: &quot;text&quot;, text: JSON.stringify(order) + &quot;\n&quot; },
      { type: &quot;text&quot;, text: JSON.stringify(message) },
    ],
    questions: {

        instructions: &quot;What is the right resolution given `tier` and `order`?&quot;,
        criteria: {
          instant_refund: &quot;Refund without return. Low value or clear fault.&quot;,
          replacement_shipment: &quot;Ship a replacement. Customer returns the original.&quot;,
          troubleshooting_flow: &quot;The issue may be fixable by the customer.&quot;,
          human_escalation: &quot;&quot;,
        },
      },
      churn_risk: {
        type: &quot;score&quot;,
        instructions: &quot;How likely is the customer to churn if the issue is not resolved now?&quot;,
        criteria: [&quot;No churn signal&quot;, &quot;Mild frustration&quot;, &quot;Mentions alternatives&quot;, &quot;Threatens to cancel&quot;],
      },
    },
  });
  
  const { is_defect, next_action, churn_risk } = result.answers ?? {};
  let action = &quot;human_escalation&quot;;
  if (
    is_defect?.type === &quot;noul&quot; &amp;&amp; next_action?.type === &quot;choice&quot; &amp;&amp;
    (is_defect.noul ?? 0) &gt; 0.9 &amp;&amp; (next_action.confidence ?? 0) &gt; 0.6
  ) {
    action = next_action.choice ?? action;
  }
  console.log(action, churn_risk?.type === &quot;score&quot; ? churn_risk.score : undefined);

## Answers, probabilities, and confidence  {% id=&quot;confidence&quot; %}

Each answer includes calibrated probabilities and a confidence score:

*   **Top value:** Probability of yes for binary questions, most likely option
  for choice questions, or probability-weighted expected level for score
  questions.
*   **Probabilities:** On choice and score answers, a map of calibrated
  probabilities across all options or levels (summing to 1). For yes/no
  answers, the probability of no is 1 minus the yes probability.
*   **Confidence:** Estimated probability (from 0 to 1) that the top answer is
  right. Equals the top outcome&#39;s probability, or `max(noul, 1 - noul)` for
  yes/no questions.

Use the answer value to pick an action and confidence to decide whether to run
it automatically:

```python
answer = result.answers[&quot;department&quot;]
if answer.confidence &gt;= 0.7:
    route_to(answer.choice)
else:
    route_to(&quot;human_review&quot;)
```

{% callout type=&quot;note&quot; %}
  Set thresholds using labeled examples from your own traffic. Weigh the cost
  of a false positive against a false negative.

{% /callout %}

## Input  {% id=&quot;input&quot; %}

The input field accepts text, image, audio, video, and PDF document blocks
using the same content block schema as the
[Interactions API](/docs/interactions-overview) (tool-call, tool-result, and
thought blocks aren&#39;t supported):

```none
Input   = string | Content | Content[]
Content = TextContent | ImageContent | AudioContent | VideoContent | DocumentContent
```

| Block | Fields | Supported MIME types |
| :--- | :--- | :--- |
| `text` | `text` | n/a |
| `image` | `data` or `uri`, `mime_type`, optional `resolution` | `image/png`, `image/jpeg`, `image/webp`, `image/heic`, `image/heif`, `image/gif`, `image/bmp`, `image/tiff` |
| `audio` | `data` or `uri`, `mime_type` | `audio/wav`, `audio/mp3`, `audio/mpeg`, `audio/aiff`, `audio/aac`, `audio/ogg`, `audio/flac`, `audio/m4a`, `audio/opus`, `audio/webm`, `audio/l16`, `audio/alaw`, `audio/mulaw` |
| `video` | `data` or `uri`, `mime_type`, optional `resolution` | `video/mp4`, `video/mpeg`, `video/mov`, `video/avi`, `video/webm`, `video/wmv`, `video/x-flv`, `video/3gpp` |
| `document` | `data` or `uri`, `mime_type` | `application/pdf` |

*   Inline data accepts base64-encoded bytes (up to 100 MB per request, or
  50 MB for PDFs).
*   URI inputs accept [Files API](/docs/files) URIs (`file.uri`) and public or
  signed HTTPS URLs (up to 15 MB per external URL).
*   Always set the MIME type to the real file format. The API rejects generic
  octet-stream types and content that doesn&#39;t match the block type.
*   The API concatenates adjacent text blocks in `input` and `instructions` in
  order with no separator. Include your own spaces or newlines (`\n`) between
  blocks.
*   Input can&#39;t be empty.

### Structured data  {% id=&quot;structured-data&quot; %}

Serialize JSON objects and arrays to a string and pass them as text so keys
inside your payload stay plain data rather than content blocks. In your
question instructions, refer to JSON fields by their key path:

```python
state = json.dumps({&quot;customer&quot;: {&quot;tier&quot;: &quot;Gold&quot;}, &quot;order&quot;: {&quot;id&quot;: &quot;8821&quot;, &quot;age_days&quot;: 14}})
```

### Documents (PDF)  {% id=&quot;documents&quot; %}

Pass a PDF up to 50 MB as inline base64 bytes. For larger or reusable files,
upload them with the [Files API](/docs/files). The model reads text, tables,
charts, and page layouts together. This example checks an invoice PDF for a
purchase order number and routes it to an expense category:

{% tabs %}
  {% tab filename=&quot;decisions.py&quot; label=&quot;Python&quot; %}
  ```python
  import base64
  from google import genai
  
  client = genai.Client(http_options={&quot;api_version&quot;: &quot;v1beta&quot;})

              &quot;type&quot;: &quot;document&quot;,

              &quot;mime_type&quot;: &quot;application/pdf&quot;,
          },
      ],
      questions={
          &quot;has_po_number&quot;: {
              &quot;type&quot;: &quot;noul&quot;,

          &quot;expense_category&quot;: {
              &quot;type&quot;: &quot;choice&quot;,
              &quot;instructions&quot;: &quot;Which expense category fits this invoice?&quot;,
              &quot;criteria&quot;: {
                  &quot;cloud_infrastructure&quot;: &quot;Servers, GPU compute, hosting, or storage.&quot;,
                  &quot;software_licenses&quot;: &quot;SaaS subscriptions or seat licenses.&quot;,
                  &quot;travel&quot;: &quot;Flights, hotels, meals, or ground transport.&quot;,
                  &quot;other&quot;: &quot;Anything outside these categories.&quot;,

          },
      },

### Media resolution  {% id=&quot;media-resolution&quot; %}

Set [media resolution](/docs/media-resolution) on image and video blocks (low,
medium, high, or ultra_high) to control token cost and visual detail.
Ultra-high resolution applies to images only; audio and document blocks don&#39;t
use resolution settings.

## Best practices  {% id=&quot;best-practices&quot; %}

*   Keep each question focused on a single decision or rubric. Complex rubrics
  work in one question when criteria are explicit, or you can split
  independent checks into separate questions in one request and combine the
  answers in code.
*   Write the full question in the instructions. The model never sees question
  keys or your variable names.
*   Give each choice option and score level a short description. Make adjacent
  score levels clearly distinct, and keep score scales linear. Because score
  averages array indices (0, 1, 2, and up), exponential scales like 1, 10,
  100, and 1000 skew the expected value.
*   Plan for inputs that fit no choice option. Check confidence before acting
  on the top option, or pair the choice question with a yes/no scope check
  such as &quot;Is this message about an order?&quot;. If you add a catch-all option,
  use a non-positional key like &quot;other&quot; rather than &quot;none_of_the_above&quot;,
  since the API sorts option keys alphabetically.
*   Prefer positive phrasing. Ask &quot;Is the tier Gold?&quot; and subtract the yes
  probability from 1 in code rather than asking negated questions such as
  &quot;Is the tier NOT Gold?&quot;.
*   Send only the fields the questions need. Unrelated content lowers accuracy.
*   Compare numbers, dates, and durations in code, then pass the result or a
  named bucket in the input.
*   Treat input as untrusted. User-supplied text can argue for its own
  classification. Write explicit criteria, test with adversarial examples,
  and keep a human or a second check on high-stakes actions such as payouts.

## Decisions API or structured output  {% id=&quot;when-to-use&quot; %}

Use the Decisions API when you need calibrated probabilities over closed-ended
outcomes:

*   Route a request to a model, queue, agent, or tool.
*   Check inputs and outputs against many policy rules at once.
*   Decide which tools an agent needs, or whether to compact, escalate, or stop.
*   Filter, score, or rank candidate results against a rubric.
*   React to UI state, audio, or video frames in real time.

| Use the Decisions API when you need | Use the [Interactions API](/docs/interactions-overview) when you need |
| :--- | :--- |
| A yes/no probability, one option from a fixed set, or a rating on a fixed scale | Generated text, summaries, or explanations |
| Calibrated probabilities you can threshold | Extracted values or objects that follow your own JSON schema (see [Structured outputs](/docs/structured-output)) |
| Many independent checks over the same input in one call | Tool calls with arguments |
| Low latency and zero output token cost | Multi-step reasoning |

## Request and response reference  {% id=&quot;request&quot; %}

| Field | Type | Required | Description |
| :--- | :--- | :--- | :--- |
| `model` | string | yes | Model ID: `gemini-decision-1`. See [Gemini Decision 1](/docs/models/gemini-decision-1). |
| `input` | string, `Content`, or `Content[]` | yes | Shared context for all questions (text, image, audio, video, or PDF document). See [Input](/docs/decisions-api#input). |
| `questions` | map of string to `Question` | yes | 1 to 1,000 questions. You choose the keys (`[A-Za-z0-9_-]+`, up to 64 characters). Answers come back under the same keys. |

Every question has:

| Field | Type | Required | Description |
| :--- | :--- | :--- | :--- |
| `type` | `noul`, `choice`, or `score` | yes | Question type. |
| `instructions` | string, `TextContent`, or `TextContent[]` | yes | The question to evaluate against the input. Text only. |
| `criteria` | depends on type | choice and score: yes. noul: no. | The possible answers. See [Question types](/docs/decisions-api#question-types). |

The API evaluates each question independently against the shared input.
Questions can&#39;t see each other, and adding or removing one doesn&#39;t change the
other answers. The model never sees question keys, so write the full question in
the instructions field.

The response contains:

| Field | Type | Description |
| :--- | :--- | :--- |
| `answers` | map of string to `Answer` | One answer per question, under the same keys as `questions`. Each answer has a type that matches its question. |
| `usage` | `Usage` | Input token counts by modality (text, image, and audio, with video frames and PDF page images counted as image tokens) and 0 output tokens. Only input tokens are billed; see [Pricing](/docs/pricing#gemini-decision). |

When input safety filters block a request, the API returns an HTTP
`400 Bad Request` error instead of `answers`. The JSON `error` object includes
a `message` and a `code` (`safety`, `prohibited_content`, `blocklist`,
`image_safety`, or `content_blocked`):

```json
{
  &quot;error&quot;: {
    &quot;code&quot;: &quot;safety&quot;,
    &quot;message&quot;: &quot;Request blocked due to safety violations (harmful content). Please modify your input and retry.&quot;
  }
}
```

## Limits  {% id=&quot;limits&quot; %}

| Limit | Value |
| :--- | :--- |
| Questions per request | 1 to 1,000 (bounded by the 262,144-token context window) |
| Options per choice question | 2 to 255 |
| Levels per score question | 2 to 255 non-empty strings (2 to 10 recommended for most rubrics) |
| Question key | 1 to 64 ASCII characters matching `[A-Za-z0-9_-]+` |
| Option key | 1 to 128 characters (up to 512 UTF-8 bytes). Internal ASCII spaces are allowed. Leading or trailing spaces, control characters, and non-ASCII spaces aren&#39;t allowed. |
| Context window | 262,144 tokens across shared input and all questions |
| JSON nesting depth | 100 levels |
| Media per request | Same as the [Interactions API](/docs/interactions-overview) |
| Question instructions | Text only |

When a request exceeds a limit or fails key validation, the API returns HTTP 400
with an error message that names the rule you exceeded.

## Limitations  {% id=&quot;limitations&quot; %}

*   Available on the Gemini Developer API (v1beta) with
  [Gemini Decision 1](/docs/models/gemini-decision-1) only.
*   Question instructions accept text only. Media inside questions isn&#39;t
  supported.
*   The Decisions API doesn&#39;t support YouTube URLs or direct Cloud Storage
  (`gs://`) URIs. Pass media using a [Files API](/docs/files) URI, a public or
  signed HTTPS URL, or inline base64 bytes.
*   Conversation history, thought, and tool-call blocks aren&#39;t supported as
  input blocks. Serialize multi-turn context as text.
*   The Decisions API doesn&#39;t support context caching,
  [Batch API](/docs/batch-api), or Flex or Priority inference. Repeated input
  across requests counts in full.
